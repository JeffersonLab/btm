services:
  oracle:
    image: gvenzl/oracle-xe:21.3.0
    hostname: oracle
    ports:
      - "127.0.0.1:${BTM_ORACLE_PORT:-1521}:1521"
      - "127.0.0.1:${BTM_ORACLE_EM_PORT:-5500}:5500"
    environment:
      ORACLE_PASSWORD: testing
      TZ: 'America/New_York'
    volumes:
      - ./container/oracle/initdb.d:/container-entrypoint-initdb.d

  keycloak:
    image: jeffersonlab/keycloak:3.1.0
    hostname: keycloak
    ports:
      - "127.0.0.1:${BTM_KEYCLOAK_PORT:-8081}:8080"
      - "127.0.0.1:${BTM_KEYCLOAK_MANAGEMENT_PORT:-9991}:9990"
    environment:
      KC_FRONTEND_URL: 'http://localhost:${BTM_KEYCLOAK_PORT:-8081}/auth'
      KC_BACKEND_URL: 'http://keycloak:8080/auth'
      KC_HTTP_RELATIVE_PATH: '/auth'
      KC_BOOTSTRAP_ADMIN_USERNAME: 'admin'
      KC_BOOTSTRAP_ADMIN_PASSWORD: 'admin'
      KC_CLIENT_NAME: btm
      KC_RESOURCE: btm
      KC_REDIRECT_URIS: '["https://localhost:${BTM_HTTPS_PORT:-8443}/btm/*"]'
    volumes:
      - ./container/keycloak/initdb.d/03_customize.sh:/container-entrypoint-initdb.d/03_customize.sh

  puppet:
    image: slominskir/puppet-show:2.1.1
    hostname: puppet
    ports:
      - "127.0.0.1:${BTM_PUPPET_PORT:-3000}:3000"
    privileged: true
    environment:
      TZ: 'America/New_York'

  mailhog:
    image: mailhog/mailhog:v1.0.1
    hostname: mailhog
    ports:
      - "127.0.0.1:${BTM_SMTP_PORT:-1025}:1025"
      - "127.0.0.1:${BTM_MAILHOG_PORT:-8025}:8025"
    environment:
      TZ: 'America/New_York'

  softioc:
    image: codecr.jlab.org/acc/iac/containers/softioc:1
    hostname: softioc
    ports:
      - "127.0.0.1:${BTM_SOFTIOC_REPEATER_PORT:-5065}:5065/tcp"
      - "127.0.0.1:${BTM_SOFTIOC_PORT:-5064}:5064/tcp"
      - "127.0.0.1:${BTM_SOFTIOC_REPEATER_PORT:-5065}:5065/udp"
      - "127.0.0.1:${BTM_SOFTIOC_PORT:-5064}:5064/udp"
    volumes:
      - ./container/softioc/db:/db
    entrypoint: "/db/init.sh"
    environment:
      TZ: 'America/New_York'
      SOFTIOC_HEALTH_PV: 'BOOMUNIXTIME_h'
