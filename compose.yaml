services:
  oracle:
    extends:
      file: deps.yaml
      service: oracle

  keycloak:
    extends:
      file: deps.yaml
      service: keycloak

  puppet:
    extends:
      file: deps.yaml
      service: puppet

  mailhog:
    extends:
      file: deps.yaml
      service: mailhog

  softioc:
    extends:
      file: deps.yaml
      service: softioc

  btm:
    hostname: btm
    ports:
      - "127.0.0.1:${BTM_HTTPS_PORT:-8443}:8443"
      - "127.0.0.1:${BTM_HTTP_PORT:-8080}:8080"
      - "127.0.0.1:${BTM_MANAGEMENT_PORT:-9990}:9990"
    environment:
      # The browser reaches Keycloak and the app on the host's ports
      KEYCLOAK_FRONTEND_SERVER_URL: 'http://localhost:${BTM_KEYCLOAK_PORT:-8081}/auth'
      FRONTEND_SERVER_URL: 'https://localhost:${BTM_HTTPS_PORT:-8443}'
